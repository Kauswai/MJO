name: update-mjo-data

# Computes the RMM index (analysis + GEFS ensemble forecast) and publishes
# mjo.json on GitHub Pages, where the Windy plugin fetches it (Pages sends
# `Access-Control-Allow-Origin: *`, so windy.com can read it).

on:
    schedule:
        # GEFS 00Z reaches +192 h on AWS around 05:30 UTC
        - cron: '40 6 * * *'
        # second run in case the morning run was early or failed
        - cron: '40 13 * * *'
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        defaults:
            run:
                working-directory: windy-plugin-mjo
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v7
              with:
                  python-version: '3.12'
                  cache: pip
                  cache-dependency-path: windy-plugin-mjo/pipeline/requirements.txt

            - run: pip install -r pipeline/requirements.txt

            # GEFS 15S-15N reductions are cached, so daily runs only download new files
            - uses: actions/cache@v6
              with:
                  path: windy-plugin-mjo/.cache
                  key: mjo-cache-${{ github.run_id }}
                  restore-keys: mjo-cache-

            - name: Compute RMM analysis + GEFS ensemble forecast
              run: python pipeline/mjo_pipeline.py --out site/mjo.json --cache .cache --workers 32

            - name: Index page
              run: |
                  cat > site/index.html <<'EOF'
                  <!doctype html><meta charset="utf-8"><title>MJO RMM data</title>
                  <p>Data for the Windy MJO plugin: <a href="mjo.json">mjo.json</a></p>
                  EOF

            - uses: actions/configure-pages@v6
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: windy-plugin-mjo/site

    deploy:
        needs: build
        runs-on: ubuntu-24.04
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
